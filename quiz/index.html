<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pré-atendimento — Dr. Vinícius Mello</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0E0E; --card:#191919; --ink:#F5F3EF; --text:#C7C5C0; --soft:#8A8880;
    --accent:#A89581; --accent-dk:#8C7A66; --accent-lt:#26221B; --line:#2A2A2A; --cream:#FFFBF3;
    --wpp:#25D366; --wpp-ink:#0b3d1f;
    --hot:#E24B4A; --warm:#EF9F27; --cold:#8A8880;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header{padding:18px 22px 10px;display:flex;align-items:center;gap:12px}
  .mono{width:48px;height:48px;border-radius:50%;background:var(--card);color:var(--cream);object-fit:cover;
    display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;flex:none;letter-spacing:.5px;border:1px solid var(--line)}
  header h1{font-size:17px;font-weight:600;line-height:1.1;color:var(--ink);letter-spacing:.01em}
  header p{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.14em;font-weight:600;margin-top:3px}
  .barwrap{padding:0 22px}
  .bar{height:4px;background:var(--line);border-radius:999px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .35s ease}
  main{flex:1;padding:24px 22px 28px}
  .q{font-size:23px;font-weight:600;line-height:1.2;margin-bottom:20px;color:var(--ink);letter-spacing:-.01em}
  .lead{font-size:15px;color:var(--soft);margin-bottom:22px}
  .opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:15px 16px;margin-bottom:10px;font-size:15px;color:var(--ink);cursor:pointer;
    transition:border-color .15s,background .15s;line-height:1.35}
  .opt:hover,.opt:focus{border-color:var(--accent);background:var(--accent-lt);outline:none}
  .cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--accent);color:#1A1712;
    border:none;border-radius:8px;padding:16px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:.02em}
  .cta:hover{background:var(--accent-dk)}
  .cta.wpp{background:var(--wpp);color:var(--wpp-ink)}
  .cta.wpp:hover{filter:brightness(.95)}
  input{width:100%;font-family:inherit;font-size:15px;padding:14px 15px;border:1px solid var(--line);
    border-radius:10px;margin-bottom:12px;background:#101010;color:var(--ink)}
  input::placeholder{color:var(--soft)}
  input:focus{border-color:var(--accent);outline:none}
  .consent{font-size:12px;color:var(--soft);margin:4px 0 16px;line-height:1.45}
  .center{text-align:center}
  .result-h{font-size:24px;font-weight:600;margin:6px 0 6px;color:var(--ink)}
  .sub{font-size:15px;color:var(--soft);margin-bottom:22px}
  .recap{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px 16px;margin-top:18px;text-align:left}
  .recap .row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:13px;color:var(--soft)}
  .recap .row:first-of-type{border-top:none}
  .recap .row b{color:var(--ink);font-weight:500;text-align:right}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .badges span{font-size:12px;color:var(--cream);background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
  footer{padding:16px 22px 28px;font-size:11px;color:var(--soft);text-align:center;line-height:1.5}
</style>
</head>

const ans = {};
let i = 0;
const stage = document.getElementById("stage");
const bar = document.getElementById("bar");
let started = false;

const params = new URLSearchParams(location.search);
const origem = params.get("utm_content") || params.get("ad_id") || params.get("ad") || "";
const campanha = params.get("utm_campaign") || params.get("campanha") || params.get("campaign") || "";
const attrib = {
  ad_id: params.get("ad_id")||"", adset_id: params.get("adset_id")||"",
  campaign_id: params.get("campaign_id")||"", utm_content: params.get("utm_content")||"",
  campanha: campanha
};

function fbq_safe(){ if(CFG.PIXEL_ID && window.fbq){ fbq.apply(null, arguments); } }

/* --- Rastreamento de etapas do funil (pixel + planilha) --- */
var SID = (function(){
  try{ var k="dv_sid", s=sessionStorage.getItem(k);
    if(!s){ s=Date.now().toString(36)+Math.random().toString(36).slice(2,8); sessionStorage.setItem(k,s); }
    return s;
  }catch(e){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
})();

function beacon(payload){
  if(!CFG.LEAD_ENDPOINT) return;
  try{
    var body=JSON.stringify(payload);
    if(navigator.sendBeacon){
      navigator.sendBeacon(CFG.LEAD_ENDPOINT, new Blob([body],{type:"text/plain;charset=utf-8"}));
    }else{
      fetch(CFG.LEAD_ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:body});
    }
  }catch(e){}
}

function trackStep(idx){
  var s=steps[idx]||{};
  var key=s.key||s.type||("step"+idx);
  fbq_safe("trackCustom","QuizStep",{step_num:idx, step_key:key});
  beacon({type:"step", sid:SID, step_num:idx, step_key:key,
    ad_id:attrib.ad_id, adset_id:attrib.adset_id, campaign_id:attrib.campaign_id, origem:origem, campanha:campanha});
}

function render(){
  bar.style.width = Math.round(i/(steps.length-1)*100)+"%";
  const s = steps[i];
  stage.innerHTML = "";
  window.scrollTo(0,0);
  trackStep(i);

  if(s.type==="intro"){
    stage.innerHTML =
      '<h2 class="q">Comece seu pré-atendimento para cirurgia plástica</h2>'+
      '<p class="lead">Responda algumas perguntas rápidas para que a equipe do Dr. Vinícius entenda seu caso e oriente os próximos passos da sua jornada — com clareza, cuidado e responsabilidade.</p>'+
      '<div class="badges">'+
        '<span>Cirurgia Plástica</span>'+
        '<span>Pré-atendimento seguro</span>'+
        '<span>Atendimento humanizado</span>'+
      '</div>';
    button("Iniciar meu pré-atendimento", ()=>{ if(!started){started=true; fbq_safe('trackCustom','PreAtendimentoStart');} i++; render(); });
    return;
  }

  if(s.type==="contato"){
    stage.innerHTML =
      '<h2 class="q">Quase lá!</h2>'+
      '<p class="lead">Deixe seu contato para a equipe do Dr. Vinícius falar com você.</p>'+
      '<input id="nome" placeholder="Seu nome" autocomplete="name">'+
      '<input id="fone" placeholder="Seu WhatsApp com DDD" inputmode="tel" autocomplete="tel">'+
      '<p class="consent">Ao continuar, você concorda em ser contatada pela equipe do Dr. Vinícius Mello. Seus dados não são compartilhados com terceiros.</p>';
    button("Enviar meu pré-atendimento", ()=>{
      const nome=val("nome"), fone=val("fone");
      if(!nome || fone.replace(/\D/g,"").length < 10){ alert("Por favor, preencha nome e um WhatsApp válido com DDD."); return; }
      ans.nome=nome; ans.fone=fone;
      submitLead();
      i++; render();
    });
    return;
  }

  if(s.type==="fim"){ finish(); return; }

  stage.innerHTML = '<h2 class="q">'+s.q+'</h2>';
  s.opts.forEach(o=>{
    const b=document.createElement("button");
    b.className="opt"; b.textContent=o.t;
    b.onclick=()=>{ ans[s.key]={v:o.v, p:o.p||0, score:s.score!==false}; if(o.p===-99){ disqualify(); return; } i++; render(); };
    stage.appendChild(b);
  });
}

function button(label, fn){
  const b=document.createElement("button");
  b.className="cta"; b.textContent=label; b.onclick=fn;
  stage.appendChild(b);
}
function val(id){ return (document.getElementById(id).value||"").trim(); }

function score(){
  let t=0; for(const k in ans){ const a=ans[k]; if(a && a.score) t+=a.p; } return t;
}

function submitLead(){
  const total=score();
  if(CFG.PIXEL_ID && window.fbq){
    var ph=(ans.fone||"").replace(/\D/g,""); if(ph && ph.length<=11) ph="55"+ph;
    var fn=(ans.nome||"").trim().split(/\s+/)[0].toLowerCase();
    try{ fbq('init', CFG.PIXEL_ID, {ph:ph, fn:fn}); }catch(e){}
  }
  fbq_safe('track', CFG.CONV_EVENT);
  if(!CFG.LEAD_ENDPOINT) return;
  const payload={
    nome:ans.nome, fone:ans.fone,
    procedimento:ans.procedimento?ans.procedimento.v:"", plano:ans.plano?ans.plano.v:"",
    momento:ans.momento?ans.momento.v:"", decisao:ans.decisao?ans.decisao.v:"",
    historico:ans.historico?ans.historico.v:"", investimento:ans.investimento?ans.investimento.v:"",
    local:ans.local?ans.local.v:"", pontuacao:total, origem:origem, campanha:campanha, ad_id:attrib.ad_id,
    adset_id:attrib.adset_id, campaign_id:attrib.campaign_id, data:new Date().toISOString(),
    type:"lead", sid:SID, step_num:9
  };
  try{
    fetch(CFG.LEAD_ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
  }catch(e){}
}

function disqualify(){
  bar.style.width="100%";
  fbq_safe("trackCustom","QuizDisqualify");
  beacon({type:"dq", sid:SID, step_num:i, step_key:"plano_outro",
    ad_id:attrib.ad_id, adset_id:attrib.adset_id, campaign_id:attrib.campaign_id, origem:origem, campanha:campanha});
  stage.innerHTML=
    '<div class="center" style="padding:.4rem 0 1rem">'+
    '<h2 class="result-h">Agradecemos por compartilhar 💛</h2>'+
    '<p class="sub">No momento, o Dr. Vinícius realiza atendimentos <b style="color:var(--ink)">de forma particular</b> e <b style="color:var(--ink)">pela Unimed</b>. Se algum desses caminhos fizer sentido pra você, será um prazer te atender — é só refazer suas respostas abaixo.</p>'+
    '</div>';
  button("Refazer minhas respostas", ()=>{ restart(); });
}

function restart(){
  for(const k in ans){ delete ans[k]; }
  i=0; started=false; render();
}

function finish(){
  bar.style.width="100%";
  fbq_safe('trackCustom','PreAtendimentoComplete');

  const total=score();
  const linhas=[
    "Olá! Fiz o pré-atendimento no site do Dr. Vinícius.","",
    "Nome: "+ans.nome,
    "Procedimento: "+(ans.procedimento?ans.procedimento.v:"—"),
    "Atendimento: "+(ans.plano?ans.plano.v:"—"),
    "Quando pretende: "+ans.momento.v,
    "Decisão: "+ans.decisao.v,
    "Já consultou: "+ans.historico.v,
    "Investimento: "+ans.investimento.v,
    "Local: "+ans.local.v
  ];
  if(origem) linhas.push("Origem: "+origem);
  linhas.push("", "Quero agendar minha avaliação.");
  const msg=encodeURIComponent(linhas.join("\n"));

  stage.innerHTML=
    '<div class="center">'+
    '<h2 class="result-h" style="margin-top:8px">Pronto, '+esc(ans.nome)+'!</h2>'+
    '<p class="sub">Seu pré-atendimento foi registrado. Toque no botão abaixo para falar agora com a equipe do Dr. Vinícius pelo WhatsApp — é o caminho mais rápido para agendar sua avaliação.</p>'+
    '</div>';

  const a=document.createElement("a");
  a.className="cta wpp"; a.href="https://wa.me/"+CFG.WPP+"?text="+msg;
  a.rel="noopener"; a.innerHTML='<span style="font-size:20px">💬</span> Falar no WhatsApp';
  a.onclick=()=>fbq_safe('trackCustom','WhatsAppClick');
  stage.appendChild(a);

  /* Resumo e Prioridade NÃO são mostrados à paciente — vão só pra secretária (msg do WhatsApp + planilha). */
}

function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

if(CFG.PIXEL_ID){
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', CFG.PIXEL_ID);
  fbq('track', 'PageView');
}

render();
</script>
</body>
</html>
