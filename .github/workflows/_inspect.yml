name: (temp) Inspecionar planilhas

on:
  push:
    branches: [ "claude/dashboard-traffic-dr-vinicius-x0j0wu" ]
    paths:
      - "build/_inspect_sheets.py"
      - ".github/workflows/_inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Inspecionar planilhas
        run: python build/_inspect_sheets.py

      - name: Upload CSVs de amostra
        uses: actions/upload-artifact@v4
        with:
          name: sample-csvs
          path: build/_inspect_out/
          retention-days: 3
