name: (temp) Conferir outras metricas

on:
  push:
    branches: [ "claude/dashboard-traffic-dr-vinicius-x0j0wu" ]
    paths:
      - "build/_inspect7.py"
      - ".github/workflows/_inspect7.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Inspecionar
        run: python build/_inspect7.py
